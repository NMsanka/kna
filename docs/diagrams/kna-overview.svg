<text x="40" y="62" font-family="Segoe UI,sans-serif" font-size="32" fill="#1e1e1e" text-anchor="start" xml:space="preserve">KNA — system overview</text>
<text x="40" y="93" font-family="Segoe UI,sans-serif" font-size="15" fill="#5c6670" text-anchor="start" xml:space="preserve">Node 22 and TypeScript, one pnpm monorepo. Everything below runs in Docker.</text>
<text x="40" y="144" font-family="Segoe UI,sans-serif" font-size="12" fill="#f08c00" text-anchor="start" xml:space="preserve">PRODUCERS</text>
<text x="145" y="185.75" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Your repositories</text>
<text x="145" y="202" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">GitHub</text>
<text x="145" y="277.75" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">GitHub Actions</text>
<text x="145" y="294" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">analyse -&gt; publish</text>
<text x="40" y="404" font-family="Segoe UI,sans-serif" font-size="12" fill="#9c36b5" text-anchor="start" xml:space="preserve">CONSUMERS</text>
<text x="145" y="445.75" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Editor</text>
<text x="145" y="462" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Claude Code / Cursor</text>
<text x="145" y="537.75" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Terminal &amp; browser</text>
<text x="145" y="554" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">kna ask  ·  /admin</text>
<text x="380" y="144" font-family="Segoe UI,sans-serif" font-size="12" fill="#1971c2" text-anchor="start" xml:space="preserve">SERVICES</text>
<text x="505" y="194.625" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">API   :8080</text>
<text x="505" y="210.875" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Fastify 5</text>
<text x="505" y="227.125" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">ingest · search · docs · admin</text>
<text x="505" y="324.625" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Worker</text>
<text x="505" y="340.875" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">BullMQ</text>
<text x="505" y="357.125" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">indexing · documentation</text>
<text x="505" y="454.625" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">MCP server   :8081</text>
<text x="505" y="470.875" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">streamable HTTP</text>
<text x="505" y="487.125" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">7 read-only tools</text>
<text x="840" y="144" font-family="Segoe UI,sans-serif" font-size="12" fill="#2f9e44" text-anchor="start" xml:space="preserve">STATE AND MODELS</text>
<text x="990" y="190" font-family="Segoe UI,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">PostgreSQL 16</text>
<text x="990" y="205" font-family="Segoe UI,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">pgvector · HNSW · row-level security</text>
<text x="990" y="220" font-family="Segoe UI,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"></text>
<text x="990" y="235" font-family="Segoe UI,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">worker writes it · API and MCP read it</text>
<text x="990" y="320" font-family="Segoe UI,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Redis</text>
<text x="990" y="335" font-family="Segoe UI,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">job queues</text>
<text x="990" y="350" font-family="Segoe UI,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"></text>
<text x="990" y="365" font-family="Segoe UI,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">API adds jobs · worker takes them</text>
<text x="990" y="450" font-family="Segoe UI,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">MinIO / S3</text>
<text x="990" y="465" font-family="Segoe UI,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">IR bundles, the system of record</text>
<text x="990" y="480" font-family="Segoe UI,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"></text>
<text x="990" y="495" font-family="Segoe UI,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">API writes · worker reads</text>
<text x="990" y="580" font-family="Segoe UI,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">LiteLLM  -&gt;  OpenAI</text>
<text x="990" y="595" font-family="Segoe UI,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">embeddings, and the doc prose</text>
<text x="990" y="610" font-family="Segoe UI,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"></text>
<text x="990" y="625" font-family="Segoe UI,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">called by the worker and by search</text>
<rect x="111.07" y="226.875" width="67.86" height="16.25" fill="#fff" opacity="0.9"/>
<text x="145" y="239.875" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">push / PR</text>
<rect x="247.18" y="235.375" width="120.64" height="16.25" fill="#fff" opacity="0.9"/>
<text x="307.5" y="248.375" font-family="Segoe UI,sans-serif" font-size="13" fill="#e03131" text-anchor="middle" xml:space="preserve">signed IR bundle</text>
<rect x="304.65" y="365.375" width="37.7" height="16.25" fill="#fff" opacity="0.9"/>
<text x="323.5" y="378.375" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">HTTPS</text>
<rect x="265.99" y="449.375" width="98.02" height="16.25" fill="#fff" opacity="0.9"/>
<text x="315" y="462.375" font-family="Segoe UI,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">MCP over HTTP</text>
<text x="40" y="714" font-family="Segoe UI,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Two paths, one index. Code arrives from CI as a signed bundle, is stored in object storage, and the worker turns it into a searchable index.</text>
<text x="40" y="731.5" font-family="Segoe UI,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Questions arrive from an editor or a terminal and are answered from that same index — filtered in SQL by what the person asking is allowed to read.</text>
</svg>