name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kna
          POSTGRES_PASSWORD: kna
          POSTGRES_DB: kna
        options: >-
          --health-cmd "pg_isready -U kna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports: ['5432:5432']

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm exec tsc -b

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Migrate
        env:
          DATABASE_URL: postgres://kna:kna@localhost:5432/kna
        run: pnpm --filter @kna/db migrate

      # The integration tests connect as a *non-superuser* role, because a superuser bypasses
      # RLS silently and testing isolation over an owner connection proves nothing. See
      # packages/db/migrations/0005_login_roles.sql.
      - name: Configure application roles
        env:
          PGPASSWORD: kna
        run: |
          psql -h localhost -U kna -d kna -c "ALTER ROLE kna_interactive WITH PASSWORD 'ci';"
          psql -h localhost -U kna -d kna -c "ALTER ROLE kna_batch WITH PASSWORD 'ci';"

      - name: Test
        env:
          DATABASE_URL: postgres://kna:kna@localhost:5432/kna
          TEST_APP_DATABASE_URL: postgres://kna_batch:ci@localhost:5432/kna
          REDIS_URL: redis://localhost:6379
        run: pnpm test

      # The platform documents its own repositories from week one (§16 "dogfood"), so a change
      # that breaks analysis of this repo fails CI here rather than in someone else's.
      - name: Self-analysis
        run: node apps/cli/dist/bin.js describe --format summary

      - name: Guardrail scan
        run: node apps/cli/dist/bin.js scan --annotations

      # The in-repo documentation is the half of §15.8's exit plan that survives this platform
      # being switched off — "keep nothing that lives only in the platform's database". The
      # platform's own copy is regenerated on every publish; this one is written by a human
      # running a command, so without a check it silently rots. It had drifted by dozens of
      # commits before anyone noticed.
      #
      # --no-prose because the prose layer needs a model route and CI has no provider credential.
      # The deterministic sections are the ones that must not drift; prose is added platform-side.
      - name: Documentation is current
        run: |
          node apps/cli/dist/bin.js generate --no-prose
          git add --intent-to-add docs/generated
          if ! git diff --quiet -- docs/generated; then
            echo "::error::Generated documentation is out of date. Run: kna generate --no-prose"
            git diff --stat -- docs/generated
            exit 1
          fi
          echo "docs/generated matches the code"

  retrieval-eval:
    name: Retrieval eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    # §15.5 BLOCKER — "gate merges on a CI eval reporting per-stratum deltas with confidence
    # intervals". Runs on pull requests, where a regression can still be stopped.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b

      - name: Detect retrieval config change
        id: config
        run: node scripts/check-retrieval-config.mjs "${{ github.event.pull_request.base.sha }}"

      # The eval harness (metrics, paired bootstrap, CI gate) is implemented and tested in
      # packages/retrieval/src/eval. The *runner* that executes it against a populated index is
      # not built yet — it needs a seeded corpus, embeddings and a golden set, none of which
      # exist in CI today.
      #
      # Until then this step fails the build deliberately rather than passing silently. §15.5
      # is explicit that an ungated retrieval change is how a quality regression ships; a green
      # check that ran nothing is worse than a red one that says so.
      - name: Retrieval eval gate
        if: steps.config.outputs.changed == 'true'
        run: |
          echo "::error::Retrieval configuration changed with no measurement and no justification."
          echo ""
          echo "The gate exists (packages/retrieval/src/eval) and is unit-tested. What is"
          echo "missing is the runner: load eval_items, execute the pipeline against a seeded"
          echo "corpus, and feed evaluateGate(). Until that lands nothing here is measured."
          echo ""
          echo "So this change needs a human to say why it is safe, in writing and in the same"
          echo "diff. Add an entry to docs/retrieval-changes.md explaining the mechanism by"
          echo "which the change cannot regress quality — or stating plainly that it might, and"
          echo "why that is acceptable."
          echo ""
          echo "An entry that says 'small change, looks fine' is not one. §15.5's whole point is"
          echo "that at n=100 the eval set resolves 5-8 point deltas while most real changes move"
          echo "1-3, so looking fine was never evidence."
          exit 1

  security:
    name: Security review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # §15.2 HIGH — "third-party grammar and analyser supply chain... Pin by digest, vendor into
      # your own registry, and verify checksums — otherwise a compromised grammar package
      # executes inside your CI on every repo in the org."
      - name: Verify lockfile is unchanged by install
        run: git diff --exit-code pnpm-lock.yaml

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      # A dependency that can run arbitrary code at install time runs it on every CI runner in
      # the org, including the ones holding repo read access.
      - name: Check for install scripts in new dependencies
        run: node scripts/check-install-scripts.mjs
